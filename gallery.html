<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hearth & Hollow 🪵🌿</title>

  <link rel="icon" type="image/png" href="favicon.png">

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

  <style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Quicksand',sans-serif;
  background:linear-gradient(135deg,#fffaf5,#fdf6f0);
  color:#3e3a36;
}

header{
  background:#fdf6f0;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 8px rgba(0,0,0,.05);
}

header h1{
  margin:0;
  font-size:32px;
  font-family:'Playfair Display',serif;
  color:#5c5a51;
}

nav{
  margin-top:12px;
}

nav a{
  text-decoration:none;
  color:#7b8a72;
  font-weight:600;
  margin:0 15px;
  transition:.3s;
}

nav a:hover{
  color:#a3b18a;
}

.section{
  padding:60px 25px;
  max-width:1000px;
  margin:auto;
  text-align:center;
}

.gallery{
  background:#f7f1e8;
  padding:40px;
  border-radius:25px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:25px;
}

.gallery-item{
  width:300px;
  background:white;
  border-radius:20px;
  padding:15px;
  box-shadow:0 8px 18px rgba(0,0,0,.07);
  transition:.3s;
}

.gallery-item:hover{
  transform:translateY(-5px);
}

.gallery-item img{
  width:100%;
  border-radius:18px;
}

.gallery-item p{
  font-weight:600;
  color:#5c5a51;
}

#musicButton{
  position:fixed;
  bottom:25px;
  left:25px;
  background:#a3b18a;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:30px;
  font-family:'Quicksand',sans-serif;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.15);
  transition:.3s;
  z-index:1000;
}

#musicButton:hover{
  background:#8ca081;
  transform:translateY(-3px);
}

footer{
  text-align:center;
  padding:25px;
  color:#9e9a91;
  font-size:14px;
}

@media (max-width:768px){

header h1{
  font-size:26px;
}

nav a{
  display:inline-block;
  margin:8px;
}

.gallery{
  padding:20px;
}

.gallery-item{
  width:100%;
}

#musicButton{
  left:50%;
  transform:translateX(-50%);
}

#musicButton:hover{
  transform:translateX(-50%) translateY(-3px);
}

}

  </style>

</head>

<body>

<audio id="backgroundMusic" loop>
  <source src="cozy-music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()" id="musicButton">
🎵 Play Music
</button>

<header>

<h1>🌿 Hearth & Hollow</h1>

<nav>
<a href="index.html">Home</a>
<a href="about.html">About Me</a>
<a href="gallery.html">Gallery</a>
<a href="finds.html">Finds</a>
<a href="contact.html">Contact</a>
</nav>

</header>

<section class="section">

<h2>Curated Gallery of Inspirations ✨</h2>

<p>
A collection of my favorite moments, creations, and aesthetic inspirations.
</p>

<div class="gallery">

<div class="gallery-item">
<img src="images/hairstyle updo.jpg" alt="Hairstyle Updo">
<p>Elegant Hairstyle 🌿</p>
</div>

<div class="gallery-item">
<img src="images/earrings.jpg" alt="Earrings">
<p>Delicate Jewelry ✨</p>
</div>

<div class="gallery-item">
<img src="images/ballet.jpg" alt="Ballet">
<p>Graceful Ballet Moment 🩰</p>
</div>

</div>

</section>

<footer>
✨ Made by Patty • 2026 ✨
</footer>

<script>
function toggleMusic(){

const music=document.getElementById("backgroundMusic");
const button=document.getElementById("musicButton");

if(music.paused){
music.play();
button.innerHTML="⏸ Pause Music";
}else{
music.pause();
button.innerHTML="🎵 Play Music";
}

}
</script>

</body>
</html>
