<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hearth & Hollow 🪵🌿</title>

<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">


<style>

* {
  box-sizing: border-box;
}


body {
  margin: 0;
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(135deg, #fffaf5, #fdf6f0);
  color: #3e3a36;
}



header {
  background: #fdf6f0;
  padding: 20px;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}


header h1 {
  margin: 0;
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  color: #5c5a51;
}



nav {
  margin-top: 15px;
}


nav a {
  text-decoration: none;
  color: #7b8a72;
  font-weight: 600;
  margin: 0 12px;
  transition: .3s;
}


nav a:hover {
  color: #a3b18a;
}



.section {
  max-width: 1000px;
  margin: auto;
  padding: 60px 25px;
  text-align: center;
}


.section h2 {
  font-family: 'Playfair Display', serif;
  font-size: 35px;
  color: #5c5a51;
}



.section p {
  color: #6e6a62;
  line-height: 1.6;
}



.gallery {

  margin-top: 35px;
  background: #f7f1e8;
  padding: 35px;
  border-radius: 25px;

  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 25px;

}



.gallery-item {

  width: 300px;
  background: white;
  padding: 15px;

  border-radius: 22px;

  box-shadow: 0 8px 18px rgba(0,0,0,0.08);

  transition: .3s;

}



.gallery-item:hover {

  transform: translateY(-8px);

  box-shadow: 0 12px 25px rgba(0,0,0,0.15);

}



.gallery-item img {

  width: 100%;

  border-radius: 18px;

}



.gallery-item p {

  margin-top: 15px;

  font-weight: 600;

  color: #5c5a51;

}



/* Music Button */

#musicButton {

  position: fixed;

  bottom: 25px;

  left: 25px;

  background: #a3b18a;

  color: white;

  border: none;

  padding: 12px 22px;

  border-radius: 30px;

  font-family: 'Quicksand', sans-serif;

  font-weight: 600;

  cursor: pointer;

  box-shadow: 0 6px 15px rgba(0,0,0,0.15);

  z-index: 1000;

}



#musicButton:hover {

  background: #8ca081;

  transform: translateY(-3px);

}



/* Footer */

footer {

  text-align: center;

  padding: 25px;

  color: #9e9a91;

  font-size: 14px;

}



/* Phone Version */

@media(max-width:768px){


header h1 {

  font-size: 26px;

}


nav a {

  display: inline-block;

  margin: 7px 5px;

  font-size: 14px;

}


.section {

  padding: 40px 15px;

}


.gallery {

  padding: 20px;

}


.gallery-item {

  width: 100%;

}


#musicButton {

  left: 50%;

  transform: translateX(-50%);

}



}



</style>


</head>



<body>



<audio id="backgroundMusic" loop>

  <source src="cozy-music.mp3" type="audio/mpeg">

</audio>


<button onclick="toggleMusic()" id="musicButton">

🎵 Play Music

</button>




<header>


<h1>🌿 Hearth & Hollow</h1>


<nav>

<a href="index.html">Home</a>

<a href="about.html">About Me</a>

<a href="gallery.html">Gallery</a>

<a href="finds.html">Finds</a>

<a href="contact.html">Contact</a>

</nav>


</header>




<section class="section">


<h2>Curated Gallery of Inspirations ✨</h2>


<p>

A collection of my favorite moments, creations, and aesthetic inspirations.

</p>




<div class="gallery">



<div class="gallery-item">

<img src="images/hairstyle updo.jpg" alt="Hairstyle Updo">

<p>Elegant Hairstyle 🌿</p>

</div>




<div class="gallery-item">

<img src="images/earrings.jpg" alt="Earrings">

<p>Delicate Jewelry ✨</p>

</div>




<div class="gallery-item">

<img src="images/ballet.jpg" alt="Ballet">

<p>Graceful Ballet Moment 🩰</p>

</div>



</div>



</section>




<footer>

✨ Made by Patty • 2026 ✨

</footer>




<script>

function toggleMusic(){

let music = document.getElementById("backgroundMusic");

let button = document.getElementById("musicButton");


if(music.paused){

music.play();

button.innerHTML = "⏸ Pause Music";

}

else{

music.pause();

button.innerHTML = "🎵 Play Music";

}


}

</script>



</body>

</html>
