   #musicButton {
  position: fixed;
  bottom: 25px;
  left: 25px;
  background: #a3b18a;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 30px;
  font-family: 'Quicksand', sans-serif;
  font-weight: 600;
  cursor: pointer;
}

#musicButton:hover {
  background: #8ca081;
}
    <audio id="backgroundMusic" loop>
  <source src="cozy-music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()" id="musicButton">
  🎵 Play Music
</button>

<script>
function toggleMusic() {
  let music = document.getElementById("backgroundMusic");
  let button = document.getElementById("musicButton");

  if (music.paused) {
    music.play();
    button.innerHTML = "⏸ Pause Music";
  } else {
    music.pause();
    button.innerHTML = "🎵 Play Music";
  }
}
</script>
